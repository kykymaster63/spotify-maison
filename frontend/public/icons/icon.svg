<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- Groupe icône (anneau vinyle + play) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="242" r="132" fill="none" stroke="#ffffff" stroke-width="16"/>
    <path d="M218 176 L218 308 L334 242 Z" fill="#ffffff"/>
  </g>

  <!-- Barres d'égaliseur (clin d'oeil "maison" / vivant) -->
  <g fill="#ffffff">
    <rect x="196" y="392" width="20" height="46" rx="10"/>
    <rect x="246" y="366" width="20" height="72" rx="10"/>
    <rect x="296" y="380" width="20" height="58" rx="10"/>
    <rect x="346" y="356" width="20" height="82" rx="10"/>
  </g>
</svg>
